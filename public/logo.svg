<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 蓝色圆形底盘 -->
  <circle cx="24" cy="24" r="22" fill="#1E40AF"/>
  <circle cx="24" cy="24" r="19" fill="#1D4ED8"/>

  <!-- 指南针四向箭头 -->
  <!-- 上 N -->
  <path d="M24 5 L26 14 L24 12 L22 14 Z" fill="white"/>
  <!-- 下 S -->
  <path d="M24 43 L22 34 L24 36 L26 34 Z" fill="white" opacity="0.7"/>
  <!-- 左 W -->
  <path d="M5 24 L14 22 L12 24 L14 26 Z" fill="white" opacity="0.7"/>
  <!-- 右 E -->
  <path d="M43 24 L34 26 L36 24 L34 22 Z" fill="#F97316"/>

  <!-- 斜角小箭头 -->
  <path d="M9.5 9.5 L16 16" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M38.5 9.5 L32 16" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M9.5 38.5 L16 32" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M38.5 38.5 L32 32" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- 工具箱主体 -->
  <rect x="14" y="25" width="20" height="12" rx="2" fill="#F59E0B"/>
  <rect x="14" y="25" width="20" height="12" rx="2" fill="url(#boxGrad)"/>
  <!-- 工具箱提手 -->
  <path d="M19 25 L19 22 Q19 20 21 20 L27 20 Q29 20 29 22 L29 25" stroke="#D97706" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- 横条分割 -->
  <rect x="14" y="30" width="20" height="1.5" fill="#D97706" opacity="0.5"/>
  <!-- 锁扣 -->
  <rect x="22" y="28.5" width="4" height="3" rx="0.8" fill="#92400E"/>
  <rect x="23" y="29.5" width="2" height="1.5" rx="0.4" fill="#F59E0B"/>

  <!-- 橙色环绕弧 -->
  <path d="M13 22 Q24 11 35 22" stroke="#F97316" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- 弧线箭头头部 -->
  <path d="M33 19.5 L35 22 L30.5 22" stroke="#F97316" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
</svg>
